<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pengurus - HIMATIF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div class="bg-primary text-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-light">HIMATIF</div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-users me-2"></i>Data Pengurus</a>
                <a href="tambah-pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-user-plus me-2"></i>Tambah Pengurus</a>
                <a href="rekap-pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white active fw-bold"><i class="fas fa-chart-pie me-2"></i>Rekap Pengurus</a>
                <a href="#" id="btn-logout" class="list-group-item list-group-item-action bg-transparent text-white text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        
        <div id="page-content-wrapper" class="bg-light w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3 text-primary" id="menu-toggle" style="cursor: pointer;"></i>
                    <h5 class="m-0 fw-bold text-dark">Rekap Data Pengurus</h5>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4" id="rekap-container">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white py-3 border-bottom">
                                <h6 class="mb-0 fw-bold"><i class="fas fa-user-tie me-2 text-primary"></i>Rekap Berdasarkan Jabatan</h6>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light"><tr><th>Jabatan</th><th class="text-end">Jumlah</th></tr></thead>
                                    <tbody id="rekap-jabatan"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white py-3 border-bottom">
                                <h6 class="mb-0 fw-bold"><i class="fas fa-sitemap me-2 text-primary"></i>Rekap Berdasarkan Divisi</h6>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light"><tr><th>Divisi</th><th class="text-end">Jumlah</th></tr></thead>
                                    <tbody id="rekap-divisi"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/pengurus.js"></script>
</body>
</html>
