<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengurus - HIMATIF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-primary text-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-light">HIMATIF</div>
            <div class="list-group list-group-flush my-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white active fw-bold"><i class="fas fa-users me-2"></i>Data Pengurus</a>
                <a href="tambah-pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-user-plus me-2"></i>Tambah Pengurus</a>
                <a href="rekap-pengurus.html" class="list-group-item list-group-item-action bg-transparent text-white"><i class="fas fa-chart-pie me-2"></i>Rekap Pengurus</a>
                <a href="#" id="btn-logout" class="list-group-item list-group-item-action bg-transparent text-white text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        
        <div id="page-content-wrapper" class="bg-light w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3 text-primary" id="menu-toggle" style="cursor: pointer;"></i>
                    <h5 class="m-0 fw-bold text-dark">Data Pengurus HIMATIF</h5>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="row mb-3 d-flex justify-content-between align-items-center">
                            <div class="col-md-3 mb-2">
                                <input type="text" id="search-input" class="form-control" placeholder="Cari berdasarkan NIM atau Nama...">
                            </div>
                            <div class="col-md-2 mb-2">
                                <select id="filter-jabatan" class="form-select">
                                    <option value="Semua Jabatan">Semua Jabatan</option>
                                    <option value="KAHIM">KAHIM</option>
                                    <option value="WAKAHIM">WAKAHIM</option>
                                    <option value="Koordinator Eksternal">Koordinator Eksternal</option>
                                    <option value="Koordinator Internal">Koordinator Internal</option>
                                    <option value="Sekretaris Umum">Sekretaris Umum</option>
                                    <option value="Bendahara Umum">Bendahara Umum</option>
                                    <option value="Kepala Divisi">Kepala Divisi</option>
                                    <option value="Wakil Kepala Divisi">Wakil Kepala Divisi</option>
                                    <option value="Anggota">Anggota</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <select id="filter-divisi" class="form-select">
                                    <option value="Semua Divisi">Semua Divisi</option>
                                    <option value="Pengurus Inti">Pengurus Inti</option>
                                    <option value="Agama">Agama</option>
                                    <option value="Administrasi dan Kesekretariatan">Administrasi & Kesekretariatan</option>
                                    <option value="Kaderisasi">Kaderisasi</option>
                                    <option value="Humas">Humas</option>
                                    <option value="IPTEK">IPTEK</option>
                                    <option value="Minat dan Bakat">Minat dan Bakat</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2">
                                <select id="filter-status" class="form-select">
                                    <option value="Semua Status">Semua Status</option>
                                    <option value="Aktif">Aktif</option>
                                    <option value="Tidak Aktif">Tidak Aktif</option>
                                </select>
                            </div>
                            <div class="col-md-2 mb-2 text-end">
                                <button id="btn-export" class="btn btn-success w-100"><i class="fas fa-file-csv me-1"></i> Export CSV</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th>No</th>
                                        <th>NIM</th>
                                        <th>Nama Lengkap</th>
                                        <th>L/P</th>
                                        <th>No. HP</th>
                                        <th>Jabatan</th>
                                        <th>Divisi</th>
                                        <th>Periode</th>
                                        <th>Status</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="table-pengurus-body">
                                    <!-- Data Rendered by JS -->
                                </tbody>
                            </table>
                            <div id="empty-state" class="text-center py-5 d-none text-muted">
                                <i class="fas fa-folder-open fs-1 mb-3"></i>
                                <h5>Data tidak ditemukan</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/pengurus.js"></script>
</body>
</html>
