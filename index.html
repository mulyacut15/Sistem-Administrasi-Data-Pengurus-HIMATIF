<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Administrasi HIMATIF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3 class="text-primary fw-bold">HIMATIF</h3>
                            <p class="text-muted small">Sistem Administrasi Data Pengurus</p>
                        </div>
                        <div id="login-alert" class="alert alert-danger d-none small" role="alert"></div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" id="username" class="form-control form-control-lg" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control form-control-lg" placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 btn-lg fw-bold">LOGIN</button>
                        </form>
                        <div class="text-center mt-4 text-muted small">
                            Gunakan: admin / himatif123
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
